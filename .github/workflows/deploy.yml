name: Deploy

on:
  workflow_call:
    inputs:
      framework:
        description: ".net framework"
        type: string
        required: true
      branch:
        description: "Git branch used for this build"
        type: string
        required: true
      major_version:
        description: "Sonarr major version"
        type: string
        required: true
      version:
        description: "Sonarr version"
        type: string
        required: true

jobs:
  package:
    strategy:
      matrix:
        platform: [linux, macos, windows]
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: ubuntu-latest
          - platform: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          platform: ${{ matrix.platform }}
          artifact: build_${{ matrix.platform }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  docker:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build_linux
          path: _artifacts

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          image="${image,,}"

          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.branch }}" == "main" ]]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.channel }}

  release:
    needs: [package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: release_*
          merge-multiple: true

      - name: Get Previous Release
        id: previous-release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          latest: true
          prerelease: ${{ inputs.branch != 'main' }}
          doNotFailIfNotFound: true

      - name: Generate Release Notes
        id: generate-release-notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ inputs.version }}',
              target_commitish: '${{ github.sha }}',
            };

            const previousTag = `${{ steps.previous-release.outputs.tag_name || '' }}`.trim();

            if (previousTag) {
              params.previous_tag_name = previousTag;
            }

            const { data } = await github.rest.repos.generateReleaseNotes(params)
            return data.body

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: _artifacts/Sonarr.*
          commit: ${{ github.sha }}
          generateReleaseNotes: false
          body: ${{ steps.generate-release-notes.outputs.result }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.branch != 'main' }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}
